<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10161d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jalan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a110e;--glass:rgba(24,34,30,.46);--glass2:rgba(14,21,18,.72);--edge:rgba(255,255,255,.13);--tx:#f4f7f3;--mut:rgba(244,247,243,.58);--mint:#bff5cf;--bad:#ff5a4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--tx);font:300 16px Outfit,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0}
#map.night .maplibregl-canvas{filter:invert(.92) hue-rotate(180deg) saturate(.55) brightness(.85)}
#vg{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(rgba(5,10,8,.65),transparent 26%,transparent 50%,rgba(5,10,8,.72))}
.glass{background:linear-gradient(155deg,rgba(255,255,255,.11),transparent 42%),var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--edge);box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}
.sheet,#turn,#spd,#res{background:linear-gradient(155deg,rgba(255,255,255,.08),transparent 40%),var(--glass2)}
.fixed{position:fixed;z-index:5}
button{font:400 16px Outfit,sans-serif;color:var(--tx);border:0;background:none}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
#top{left:12px;right:12px;top:calc(10px + env(safe-area-inset-top))}
body:not(.ready) #top{opacity:0}body.ready #top{animation:in .9s cubic-bezier(.22,1,.36,1) both}
@keyframes in{from{opacity:0;transform:translateY(-14px)}}
#bar{display:flex;gap:10px;align-items:center}
#sb{flex:1;display:flex;align-items:center;gap:10px;border-radius:28px;padding:0 20px;height:54px}
#sb input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:300 18px Outfit,sans-serif}
#sb input::placeholder{color:var(--mut)}
.circ{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;padding:0}
.circ .ic{width:22px;height:22px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;border-radius:22px;padding:10px 16px 10px 14px;white-space:nowrap;font-size:15px}
#res{margin-top:8px;border-radius:24px;overflow:hidden;border:1px solid var(--edge)}#res:empty{display:none}
#res div{padding:13px 20px;border-top:1px solid var(--edge);font-size:17px}#res div:first-child{border-top:0}
#res small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.sheet{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:34px;padding:10px 22px 20px;display:none;border:1px solid var(--edge)}
.grab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.28);margin:0 auto 14px}
.lbl{color:var(--mut);font-size:15px;display:flex;align-items:center;gap:8px}
.c{text-align:center;justify-content:center}
.big{font-weight:200;font-size:72px;line-height:1.05;letter-spacing:-1px}
i{font-style:normal;font-size:.36em;color:var(--mut);margin-left:5px;font-weight:300;letter-spacing:0}
.alts{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
.alt{border:1px solid var(--edge);border-radius:18px;padding:8px 14px;font-size:15px;color:var(--mut);background:rgba(255,255,255,.05)}
.alt.sel{color:var(--ink);background:var(--mint);border-color:var(--mint);box-shadow:0 0 22px rgba(191,245,207,.35)}
.stats{display:grid;grid-template-columns:1fr 1.5fr 1fr;margin-bottom:18px;padding:12px 0;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.stats>div{text-align:center;min-width:0;padding:0 8px}.stats>div+div{border-left:1px solid var(--edge)}
.stats b{display:block;font-weight:300;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats .lbl{justify-content:center;font-size:13px;margin-top:2px}
.cta{display:flex;gap:10px}
.cta button{height:56px;border-radius:28px;padding:0 22px;border:1px solid var(--edge);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:8px}
.cta .go{flex:1;background:var(--mint);color:var(--ink);font-weight:500;font-size:18px;border-color:var(--mint);box-shadow:0 0 30px rgba(191,245,207,.3)}
.cta .end{background:rgba(255,90,77,.2);border-color:rgba(255,90,77,.5);color:#ffb7b0}
.cta .sq{width:56px;padding:0}.cta .off{opacity:.55}
#turn{left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));border-radius:32px;padding:14px 22px 14px 14px;display:none;align-items:center;gap:16px;border:1px solid var(--edge)}
#arr{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:36px;line-height:1;color:var(--ink);background:var(--mint);box-shadow:0 0 34px rgba(191,245,207,.45);flex:none}
#dist{font-weight:200;font-size:48px;line-height:1}#ins{font-size:19px;margin-top:4px}
#stat{display:flex;justify-content:space-around;text-align:center;margin:4px 0 18px}
#stat .big{font-size:38px}#stat .lbl{justify-content:center;font-size:14px}
#spd{left:12px;bottom:calc(236px + env(safe-area-inset-bottom));border-radius:30px;padding:14px 22px;display:none;flex-direction:column;border:1px solid var(--edge)}
#spd .big{font-size:56px}
#rep{right:12px;bottom:calc(236px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:10px}
body.navmode #rep{display:flex}
#rc{left:50%;top:calc(124px + env(safe-area-inset-top));transform:translateX(-50%);display:none;align-items:center;gap:8px;border-radius:26px;padding:12px 20px 12px 16px;color:var(--mint);animation:in .35s ease both}
.me{position:relative;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 4px 18px rgba(0,0,0,.45)}
.me:before{content:"";position:absolute;inset:-28px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.75);background:rgba(255,255,255,.08)}
.me:after{content:"";position:absolute;left:50%;top:50%;width:18px;height:20px;margin:-10px 0 0 -9px;background:#0a110e;clip-path:polygon(50% 0,100% 100%,50% 76%,0 100%)}
.dpin{width:26px;height:26px;border-radius:50%;background:var(--mint);border:4px solid var(--ink);box-shadow:0 0 0 2px var(--mint),0 0 26px rgba(191,245,207,.8);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{from{box-shadow:0 0 0 2px var(--mint),0 0 0 0 rgba(191,245,207,.55)}to{box-shadow:0 0 0 2px var(--mint),0 0 0 30px rgba(191,245,207,0)}}
.pin{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--edge)}.pin .ic{width:20px;height:20px}
.pin.police{color:#7bb8ff}.pin.accident{color:#ff7a6e}.pin.hazard{color:#ffc65c}.pin.camera{color:#e9eee9}

@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.985)}}
@keyframes drop{from{opacity:0;transform:translateY(-34px) scale(.985)}}
.sheet{animation:rise .6s cubic-bezier(.22,1,.36,1) both}
#turn{animation:drop .55s cubic-bezier(.22,1,.36,1) both}
#spd,body.navmode #rep{animation:rise .6s .1s cubic-bezier(.22,1,.36,1) both}
button{transition:transform .25s cubic-bezier(.22,1,.36,1),background .3s,opacity .3s,box-shadow .3s}
button:active{transform:scale(.96)}
#map .maplibregl-canvas{transition:filter .7s ease}
#hist{display:none;max-height:min(64vh,580px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}#hist::-webkit-scrollbar{display:none}
.hh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.hh b{font-weight:400;font-size:22px;display:block}.hh small{color:var(--mut);font-size:14px}
.hh div:last-child{display:flex;gap:8px;align-items:center}.hh .chip{padding:9px 16px}
.hh .sq{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--edge);background:rgba(255,255,255,.08)}
.hi{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;text-align:left;padding:14px 4px;border-top:1px solid var(--edge);border-radius:0}
.hi:active{background:rgba(255,255,255,.06);transform:none}
.hi span{min-width:0}.hi b{display:block;font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi small{display:block;color:var(--mut);font-size:13px;margin-top:3px}.hi .r{text-align:right;flex:none;font-size:16px}
.empty{color:var(--mut);padding:22px 4px 10px;text-align:center}
#intro{position:fixed;inset:0;z-index:100;background:#080d0b;overflow:hidden;transition:opacity .8s cubic-bezier(.4,0,.2,1)}
#intro.out{opacity:0;pointer-events:none}
#intro .st{position:absolute;inset:0;--cw:min(76vw,330px);--ch:calc(var(--cw)*.283)}
#rig{position:absolute;left:50%;top:44%;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);will-change:transform;transform:translateX(-120vw)}
#rig:before{content:"";position:absolute;left:-22%;right:-22%;top:-70%;bottom:-120%;background:radial-gradient(closest-side at 50% 60%,rgba(150,235,185,.24),transparent)}
#chs{position:absolute;inset:0}#chs img{position:absolute;inset:0;width:100%;height:100%;display:block}
.wh{position:absolute;top:27.1%;width:20.72%;aspect-ratio:1;background:var(--wheel) center/100% 100% no-repeat}
#wl{left:10.46%}#wr{left:70.35%}
#tr{position:absolute;right:88%;top:30%;width:110%;height:36%;background:linear-gradient(90deg,transparent,rgba(191,245,207,.45));filter:blur(7px);border-radius:50%;opacity:0}
#rd{position:absolute;left:10%;right:10%;top:calc(44% + var(--ch)/2 - 1px);height:2px;background:linear-gradient(90deg,transparent,rgba(191,245,207,.4),transparent);opacity:0}
#wd{position:absolute;left:0;right:0;top:calc(44% + var(--ch)/2 + 48px);text-align:center;font:200 30px Outfit,sans-serif;letter-spacing:.34em;text-indent:.34em;color:var(--mint);opacity:0}
#sheet{max-height:min(68vh,640px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-left:14px;padding-right:14px}#sheet::-webkit-scrollbar{display:none}
#sheet .hh{padding:0 8px}#sheet .chips{margin-top:4px}
.rc{display:block;width:100%;text-align:left;border:1px solid var(--edge);border-radius:28px;padding:16px 18px 16px;margin-bottom:10px;background:rgba(255,255,255,.05);cursor:pointer;transition:border-color .3s,background .3s,box-shadow .3s,transform .25s cubic-bezier(.22,1,.36,1)}
.rc:active{transform:scale(.985)}
.rc.sel{border-color:var(--mint);background:rgba(191,245,207,.09);box-shadow:0 0 28px rgba(191,245,207,.18)}
.rc .rt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rc .rbig{font-weight:300;font-size:36px;line-height:1.05;letter-spacing:-.5px}.rc .rbig i{font-size:.42em}
.rc .rsub{font-size:16px;margin-top:4px}.rc .rvia{color:var(--mut);font-size:15px;margin-top:3px}
.rc .go{height:48px;border-radius:24px;padding:0 24px;background:var(--mint);color:var(--ink);font-weight:500;font-size:17px;flex:none;display:flex;align-items:center;gap:6px;box-shadow:0 0 24px rgba(191,245,207,.25)}
.rc:not(.sel) .go{background:rgba(255,255,255,.1);color:var(--tx);box-shadow:none}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tags:empty{display:none}
.tag{border-radius:14px;padding:5px 11px;font-size:13.5px;font-weight:400;background:rgba(255,255,255,.08);color:var(--mut)}
.tag.fast{background:rgba(191,245,207,.16);color:var(--mint)}.tag.toll{background:rgba(255,198,92,.16);color:#ffc65c}
.rlab{padding:7px 12px;border-radius:16px;font-size:14px;font-weight:400;white-space:nowrap;background:var(--glass2);border:1px solid var(--edge);color:var(--tx);box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer;animation:pop .45s cubic-bezier(.22,1,.36,1) both}
.rlab.cur{background:var(--mint);color:var(--ink);border-color:var(--mint);font-weight:500}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

const $=id=>document.getElementById(id);

const IC={police:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/>',accident:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',hazard:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.1"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3"/>'};
const ico=k=>`<svg class="ic" viewBox="0 0 24 24">${IC[k]}</svg>`;
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
const via=r=>(r.legs[0].steps.reduce((a,s)=>s.name&&s.distance>(a.distance||0)?s:a,{}).name)||'Local roads';
let free=false,me=null,meMk,dest=null,routes=[],sel=0,nav=false,idx=1,mute=false,lastRe=0,pins=[],destMk,lock,qt,pt,destName='',trip=null,fix=null,disp=null,dispB=0,tgtB=0,camOn=false,lt=0;

const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[101.687,3.139],zoom:12,attributionControl:{compact:true}});
map.on('load',()=>{
  map.addSource('sat',{type:'raster',tileSize:256,maxzoom:19,attribution:'Imagery © Esri',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']});
  map.addLayer({id:'sat',type:'raster',source:'sat',paint:{'raster-saturation':-0.45,'raster-brightness-max':0.62,'raster-contrast':0.15}});
  loadReports();
});
map.on('contextmenu',e=>setDest(e.lngLat,'Dropped pin'));
map.on('touchstart',e=>{if(e.points&&e.points.length>1)return;pt=setTimeout(()=>setDest(e.lngLat,'Dropped pin'),650)});
['touchend','touchmove','dragstart','zoomstart'].forEach(ev=>map.on(ev,()=>clearTimeout(pt)));

const el=document.createElement('div');el.className='me';
meMk=new maplibregl.Marker({element:el,rotationAlignment:'map',pitchAlignment:'map'});
navigator.geolocation.watchPosition(onPos,()=>alert('Turn on location access for this site.'),{enableHighAccuracy:true,maximumAge:1000});

function onPos(p){
  const c=p.coords,prev=me;me=[c.longitude,c.latitude];
  const v=c.speed>0.8?c.speed:0;
  if(v&&c.heading!=null&&!isNaN(c.heading))tgtB=c.heading;
  const r=Math.PI/180;
  fix={p:me,t:performance.now(),e:v*Math.sin(tgtB*r)/(111320*Math.cos(me[1]*r)),n:v*Math.cos(tgtB*r)/111320};
  if(!disp){disp=me.slice();dispB=tgtB;meMk.setLngLat(disp).addTo(map)}
  if(!map._c){map.jumpTo({center:me,zoom:15});map._c=1}
  if(!nav)return;
  if(trip&&prev){const d=dm(prev,me);if(d>2&&d<250)trip.m+=d}
  $('sv').textContent=Math.round((c.speed||0)*3.6);
  track();
}
// smooth follow: glide the marker and camera between GPS fixes every frame
const angDiff=(a,b)=>((b-a+540)%360)-180;
function frame(t){
  const dt=Math.min(.1,(t-(lt||t))/1000);lt=t;
  if(fix&&disp){
    const age=Math.min(1.3,(t-fix.t)/1000),k=1-Math.exp(-dt/.22);
    disp[0]+=(fix.p[0]+fix.e*age-disp[0])*k;disp[1]+=(fix.p[1]+fix.n*age-disp[1])*k;
    dispB+=angDiff(dispB,tgtB)*(1-Math.exp(-dt/.4));
    meMk.setLngLat(disp).setRotation((dispB+360)%360);
    if(nav&&!free&&camOn)map.jumpTo({center:disp,bearing:dispB,zoom:17,pitch:55});
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function lockCam(o){camOn=false;map.easeTo(Object.assign({zoom:17,pitch:55,padding:{top:320,bottom:0,left:0,right:0},essential:true,easing:x=>1-Math.pow(1-x,3)},o));map.once('moveend',()=>{camOn=true})}

// ---- search (Photon, limited to Malaysia) ----
$('q').addEventListener('input',e=>{clearTimeout(qt);const v=e.target.value.trim();if(v.length<3){$('res').innerHTML='';return}
  qt=setTimeout(()=>search(v),350)});
async function search(v){
  try{
    const c=map.getCenter();
    const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(v)}&limit=6&bbox=99.6,0.8,119.3,7.4&lat=${c.lat}&lon=${c.lng}`);
    const j=await r.json();window._hits=j.features;
    $('res').innerHTML=j.features.map((f,i)=>{const p=f.properties;
      const sub=[p.street,p.district||p.suburb,p.city||p.county,p.state].filter(Boolean).join(', ');
      return `<div onclick="pick(${i})">${p.name||p.street||'Place'}<small>${sub}</small></div>`}).join('')||'<div>No results</div>';
  }catch(e){$('res').innerHTML='<div>Search failed. Check internet.</div>'}
}
function pick(i){const f=window._hits[i];$('q').value=f.properties.name||'';$('res').innerHTML='';setDest({lng:f.geometry.coordinates[0],lat:f.geometry.coordinates[1]},f.properties.name)}

// ---- routing (OSRM) ----
function setDest(ll,name){
  dest=[ll.lng,ll.lat];destName=name||'';if(!me){alert('Waiting for your location...');return}
  if(destMk)destMk.remove();destMk=new maplibregl.Marker({element:pinEl()}).setLngLat(dest).addTo(map);
  $('q').value=name||'';$('res').innerHTML='';plan();
}
async function fetchRoutes(alt){
  const u=`https://router.project-osrm.org/route/v1/driving/${me[0]},${me[1]};${dest[0]},${dest[1]}?overview=full&geometries=geojson&steps=true&alternatives=${alt?3:'false'}`;
  const j=await (await fetch(u)).json();if(j.code!=='Ok')throw new Error(j.code);return j.routes;
}
async function plan(){
  try{routes=await fetchRoutes(true);sel=0;draw()}catch(e){alert('No route found. '+e.message)}
}
function clearLayers(){for(let i=0;i<4;i++){if(map.getLayer('g'+i))map.removeLayer('g'+i);if(map.getLayer('l'+i))map.removeLayer('l'+i);if(map.getSource('r'+i))map.removeSource('r'+i)}}
// Toll estimate. OSRM flags toll roads but has no prices, so cost = distance on toll road x rate.
// Edit these two numbers (RM per km, minimum per toll stretch) to match the roads you use.
const TOLL={perKm:.14,min:1};
function tollOf(r){let cost=0,km=0,run=0;
  const end=()=>{if(run>0){cost+=Math.max(TOLL.min,run*TOLL.perKm);km+=run;run=0}};
  r.legs[0].steps.forEach(st=>{const I=st.intersections||[],f=I.length?I.filter(x=>(x.classes||[]).includes('toll')).length/I.length:0;
    if(f>0)run+=st.distance/1000*Math.max(f,.5);else end()});end();
  return km>0?{cost:Math.ceil(cost*10)/10,km}:null}
const dur=m=>m>=60?Math.floor(m/60)+'<i>hr</i> '+(m%60?m%60+'<i>min</i>':''):m+'<i>min</i>';
let labs=[];
function clearLabels(){labs.forEach(l=>l.remove());labs=[]}
function pickRoute(i){sel=i;draw(false)}
function draw(fit=true){
  clearLayers();clearLabels();
  const order=routes.map((_,i)=>i).sort((a,b)=>(a===sel)-(b===sel));
  order.forEach(i=>{
    map.addSource('r'+i,{type:'geojson',data:{type:'Feature',geometry:routes[i].geometry}});
    if(i===sel)map.addLayer({id:'g'+i,type:'line',source:'r'+i,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#bff5cf','line-width':18,'line-blur':10,'line-opacity':.55}});
    map.addLayer({id:'l'+i,type:'line',source:'r'+i,layout:i===sel?{'line-cap':'round','line-join':'round'}:{},paint:i===sel?{'line-color':'#f4fff7','line-width':6}:{'line-color':'#ffffff','line-width':3.5,'line-opacity':.7,'line-dasharray':[2,1.6]}});
  });
  const mins=routes.map(r=>Math.round(r.duration/60)),best=Math.min(...mins),short=Math.min(...routes.map(r=>r.distance));
  if(!nav&&fit){const b=new maplibregl.LngLatBounds();routes.forEach(r=>r.geometry.coordinates.forEach(c=>b.extend(c)));
    map.fitBounds(b,{padding:{top:170,bottom:Math.round(innerHeight*.5),left:30,right:30},pitch:30,duration:1200})}
  // labels on the map, like Waze: selected route shows its time, others show how much slower/faster
  if(!nav)routes.forEach((r,i)=>{const c=r.geometry.coordinates,p=c[Math.floor(c.length*(.35+.12*i))],d=mins[i]-mins[sel];
    const e=document.createElement('div');e.className='rlab'+(i===sel?' cur':'');
    e.textContent=i===sel?mins[i]+' min':d===0?'Same time':Math.abs(d)+' min '+(d>0?'slower':'faster');
    e.onclick=()=>pickRoute(i);labs.push(new maplibregl.Marker({element:e}).setLngLat(p).addTo(map))});
  const keep=$('sheet').scrollTop;
  $('rsm').textContent=routes.length+(routes.length>1?' routes':' route')+' found';
  $('cards').innerHTML=routes.map((r,i)=>{const m=mins[i],t=tollOf(r),d=m-best,tags=[];
    if(m===best)tags.push('<span class="tag fast">Fastest</span>');else tags.push(`<span class="tag">${d} min slower</span>`);
    if(r.distance===short&&routes.length>1)tags.push('<span class="tag">Shortest</span>');
    tags.push(t?`<span class="tag toll">Toll ≈ RM ${t.cost.toFixed(2)}</span>`:'<span class="tag">No toll</span>');
    return `<div class="rc ${i===sel?'sel':''}" onclick="pickRoute(${i})"><div class="rt"><div><div class="rbig">${dur(m)}</div><div class="rsub">${hm(Date.now()+r.duration*1000)} arrival, ${(r.distance/1000).toFixed(1)} km</div></div><button class="go" onclick="event.stopPropagation();sel=${i};startNav()">Go</button></div><div class="rvia">Via ${esc(via(r))}</div><div class="tags">${tags.join('')}</div></div>`}).join('');
  $('sheet').scrollTop=keep;
  if(!nav&&$('hist').style.display!=='block')$('sheet').style.display='block';
}
function clearRoute(){clearLayers();clearLabels();routes=[];$('sheet').style.display='none';$('q').value='';if(destMk){destMk.remove();destMk=null}map.easeTo({pitch:0,bearing:0,padding:{top:0,bottom:0,left:0,right:0},duration:900})}

// ---- navigation ----
function dm(a,b){const R=6371000,t=Math.PI/180,dl=(b[1]-a[1])*t,dg=(b[0]-a[0])*t,
  x=Math.sin(dl/2)**2+Math.cos(a[1]*t)*Math.cos(b[1]*t)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function text(s){const m=s.maneuver,n=s.name?' onto '+s.name:'',d=m.modifier||'';
  switch(m.type){
    case 'depart':return 'Head '+(s.name?'on '+s.name:'out');
    case 'arrive':return 'You have arrived';
    case 'turn':case 'end of road':return 'Turn '+d+n;
    case 'merge':return 'Merge '+d+n;
    case 'on ramp':return 'Take the ramp'+n;
    case 'off ramp':return 'Take the exit'+n;
    case 'fork':return 'Keep '+d+n;
    case 'roundabout':case 'rotary':case 'exit roundabout':return m.exit?'At the roundabout, take exit '+m.exit+n:'Enter the roundabout'+n;
    default:return 'Continue'+n}}
const S=()=>routes[sel].legs[0].steps;
function arrow(s){const m=s.maneuver;if(m.type==='arrive')return '⚑';if(/roundabout|rotary/.test(m.type))return '↻';
  return {'left':'↰','sharp left':'↰','slight left':'↖','right':'↱','sharp right':'↱','slight right':'↗','uturn':'↶'}[m.modifier]||'↑'}
function say(t){if(mute||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';speechSynthesis.speak(u)}
async function startNav(){
  nav=true;free=false;$('rc').style.display='none';document.body.classList.add('navmode');idx=Math.min(1,S().length-1);$('sheet').style.display='none';$('top').style.display='none';$('turn').style.display='flex';$('bot').style.display='block';$('spd').style.display='flex';
  clearLabels();for(let i=0;i<4;i++)if(i!==sel&&map.getLayer('l'+i))map.removeLayer('l'+i);
  say('Starting navigation');window._said=-1;
  const b0=S()[0].maneuver.bearing_after;if(b0!=null)dispB=tgtB=b0;
  trip={id:Date.now(),at:Date.now(),name:destName||'Destination',to:dest.slice(),m:0};saveTrip(false);
  lockCam({center:me,bearing:dispB,duration:1600});track();
  try{lock=await navigator.wakeLock.request('screen')}catch(e){}
}
function stopNav(arrived){saveTrip(!!arrived);trip=null;camOn=false;nav=false;free=false;$('rc').style.display='none';document.body.classList.remove('navmode');speechSynthesis.cancel();if(lock)lock.release().catch(()=>{});
  $('turn').style.display=$('bot').style.display=$('spd').style.display='none';$('top').style.display='block';clearRoute()}
function track(){
  const st=S(),s=st[idx];if(!s||!me)return;
  const d=dm(me,s.maneuver.location);
  $('dist').innerHTML=d>=1000?(d/1000).toFixed(1)+'<i>km</i>':Math.round(d/10)*10+'<i>m</i>';
  $('ins').textContent=text(s);$('arr').textContent=arrow(s);
  if(d<250&&window._said!==idx){window._said=idx;say(s.maneuver.type==='arrive'?'You will arrive soon':'In '+Math.max(50,Math.round(d/50)*50)+' metres, '+text(s))}
  if(d<30){if(s.maneuver.type==='arrive'){say('You have arrived');stopNav(true);return}idx++;return track()}
  let sec=st[idx-1]?st[idx-1].duration*Math.min(1,d/Math.max(st[idx-1].distance,1)):0,m=d;
  for(let i=idx;i<st.length;i++){sec+=st[i].duration;m+=st[i].distance}
  $('rem').innerHTML=Math.max(1,Math.round(sec/60))+'<i>min</i>';$('km').innerHTML=(m/1000).toFixed(1)+'<i>km</i>';
  $('eta').textContent=new Date(Date.now()+sec*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
  const path=routes[sel].geometry.coordinates;let off=1e9;for(let i=0;i<path.length;i+=2){off=Math.min(off,dm(me,path[i]))}
  if(off>90&&Date.now()-lastRe>15000){lastRe=Date.now();say('Rerouting');
    fetchRoutes(false).then(r=>{routes=r;sel=0;idx=Math.min(1,S().length-1);clearLayers();draw();for(let i=1;i<4;i++)if(map.getLayer('l'+i))map.removeLayer('l'+i);track()}).catch(()=>{})}
}

// ---- saved places & reports ----
function goSaved(k){const p=store.get('saved_'+k);if(!p){alert('Pick a destination, then tap "Save as '+k+'".');return}setDest({lng:p[0],lat:p[1]},k)}
function saveDest(k){if(dest){store.set('saved_'+k,dest);alert('Saved as '+k)}}
function report(t){if(!me)return;const a=store.get('reports')||[];a.push({t,ll:me,at:Date.now()});store.set('reports',a);loadReports();say('Reported '+t)}
function loadReports(){
  pins.forEach(p=>p.remove());pins=[];
  const a=(store.get('reports')||[]).filter(r=>Date.now()-r.at<2*3600e3);store.set('reports',a);
  a.forEach(r=>{const d=document.createElement('div');d.className='pin '+r.t;d.innerHTML=ico(r.t);pins.push(new maplibregl.Marker({element:d}).setLngLat(r.ll).addTo(map))});
}
function pinEl(){const d=document.createElement('div');d.className='dpin';return d}
let sat=true;
function toggleMap(){sat=!sat;if(map.getLayer('sat'))map.setPaintProperty('sat','raster-opacity',sat?1:0);
  $('map').classList.toggle('night',!sat);$('lyr').textContent=sat?'Satellite':'Night map'}
map.on('movestart',e=>{if(nav&&e.originalEvent){free=true;$('rc').style.display='flex'}});
function recenter(){free=false;$('rc').style.display='none';if(me)lockCam({center:disp||me,bearing:dispB,duration:900})}
setInterval(loadReports,60000);
document.querySelectorAll('[data-k]').forEach(b=>b.innerHTML=ico(b.dataset.k));

// ---- trip history ----
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function saveTrip(done){if(!trip)return;const a=(store.get('trips')||[]).filter(t=>t.id!==trip.id);
  a.unshift({id:trip.id,at:trip.at,name:trip.name,to:trip.to,km:+(trip.m/1000).toFixed(1),min:Math.max(1,Math.round((Date.now()-trip.at)/60000)),done});store.set('trips',a.slice(0,60))}
addEventListener('pagehide',()=>saveTrip(false));
function when(t){const day=x=>new Date(x).setHours(0,0,0,0),g=Math.round((day(Date.now())-day(t))/864e5);
  return (g<1?'Today':g===1?'Yesterday':new Date(t).toLocaleDateString([],{day:'numeric',month:'short'}))+', '+hm(t)}
function openHist(){const a=store.get('trips')||[],km=a.reduce((x,t)=>x+t.km,0);
  $('hs').textContent=a.length?a.length+(a.length>1?' trips, ':' trip, ')+km.toFixed(1)+' km driven':'No trips yet';
  $('hl').innerHTML=a.length?a.map((t,i)=>`<button class="hi" onclick="again(${i})"><span><b>${esc(t.name)}</b><small>${when(t.at)}${t.done?'':', ended early'}</small></span><span class="r">${t.km} km<small>${t.min} min</small></span></button>`).join(''):'<div class="empty">Trips you drive with Jalan will show up here.</div>';
  $('sheet').style.display='none';$('hist').style.display='block'}
function closeHist(){$('hist').style.display='none';if(routes.length)$('sheet').style.display='block'}
function clearHist(){if(confirm('Clear all trip history?')){store.set('trips',[]);openHist()}}
function again(i){const t=(store.get('trips')||[])[i];if(!t)return;$('hist').style.display='none';setDest({lng:t.to[0],lat:t.to[1]},t.name)}

// ---- intro: car drives in, pauses, drives out, app appears ----
(function(){
  const it=$('intro'),rig=$('rig'),cs=$('chs'),wl=$('wl'),wr=$('wr'),tr=$('tr'),wd=$('wd'),rd=$('rd');let done=false;
  function end(){if(done)return;done=true;it.classList.add('out');document.body.classList.add('ready');setTimeout(()=>it.remove(),900)}
  it.addEventListener('pointerdown',end);
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(rm||!rig.animate){rig.style.transform='none';wd.style.opacity=1;setTimeout(end,rm?1000:300);return}
  const cw=rig.offsetWidth,d=innerWidth/2+cw*.6,deg=d/(cw*.1007)*57.2958,E='cubic-bezier(.1,.72,.2,1)',A='cubic-bezier(.62,0,.95,.48)',o={duration:3900,fill:'both'};
  const kx=f=>[{offset:0,transform:f(-1),easing:E},{offset:.36,transform:f(0)},{offset:.58,transform:f(0),easing:A},{offset:1,transform:f(1)}];
  rig.animate(kx(k=>`translateX(${k*d}px)`),o).onfinish=end;
  [wl,wr].forEach(w=>w.animate(kx(k=>`rotate(${k*deg}deg)`),o));
  const ee='ease-in-out';
  cs.animate([{offset:0,transform:'rotate(0)',easing:ee},{offset:.2,transform:'rotate(1deg)',easing:ee},{offset:.36,transform:'rotate(0)'},{offset:.58,transform:'rotate(0)',easing:ee},{offset:.72,transform:'rotate(-1.6deg)',easing:ee},{offset:1,transform:'rotate(-.8deg)'}],o);
  tr.animate([{offset:0,opacity:.9},{offset:.3,opacity:.25},{offset:.36,opacity:0},{offset:.6,opacity:0},{offset:.82,opacity:.7},{offset:1,opacity:.95}],o);
  wd.animate([{offset:0,opacity:0,transform:'translateY(8px)'},{offset:.3,opacity:0,transform:'translateY(8px)'},{offset:.42,opacity:1,transform:'none'},{offset:.57,opacity:1,transform:'none'},{offset:.66,opacity:0,transform:'translateY(-4px)'},{offset:1,opacity:0}],o);
  rd.animate([{offset:0,opacity:0},{offset:.12,opacity:1},{offset:.88,opacity:1},{offset:1,opacity:0}],o);
  setTimeout(end,5200);
})();
</script>
</body>
